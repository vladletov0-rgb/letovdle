<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letovdle</title>
    <style>
        :root {
            --color-correct: #538d4e;
            --color-present: #b59f3b;
            --color-absent: #3a3a3c;
            --color-key: #818384;
            --bg-color: #121213;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
            font-weight: 800;
        }

        /* Игровое поле */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 30px;
        }

        .row {
            display: flex;
            gap: 5px;
        }

        .tile {
            width: 52px;
            height: 52px;
            border: 2px solid #3a3a3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            box-sizing: border-box;
        }

        /* Состояния плиток */
        .correct { background-color: var(--color-correct); border-color: var(--color-correct); }
        .present { background-color: var(--color-present); border-color: var(--color-present); }
        .absent { background-color: var(--color-absent); border-color: var(--color-absent); }

        /* Поле ввода и кнопка */
        .controls {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }

        input {
            padding: 12px;
            font-size: 1.2rem;
            border: 2px solid #3a3a3c;
            border-radius: 4px;
            width: 140px;
            text-align: center;
            text-transform: uppercase;
            background: #121213;
            color: white;
            outline: none;
        }

        input:focus { border-color: #818384; }

        /* Клавиатура */
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 500px;
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .key {
            background-color: var(--color-key);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 15px 5px;
            min-width: 35px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            flex: 1;
            transition: transform 0.1s, background-color 0.2s;
        }

        .key:active { transform: scale(0.95); }
        .key.wide { flex: 1.5; background-color: #565758; }
        .key.enter { background-color: var(--color-correct); }

        @media (max-width: 480px) {
            .tile { width: 45px; height: 45px; font-size: 1.5rem; }
            .key { padding: 12px 2px; min-width: 25px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <h1>LETOVDLE</h1>
    
    <div id="game-board" class="grid"></div>

    <div class="controls">
        <input type="text" id="input" maxlength="5" placeholder="5 БУКВ" autocomplete="off">
        <button class="key wide enter" onclick="guess()">OK</button>
    </div>

    <div class="keyboard" id="keyboard">
        <div class="kb-row">
            <button class="key" onclick="addLetter('й')">й</button><button class="key" onclick="addLetter('ц')">ц</button><button class="key" onclick="addLetter('у')">у</button><button class="key" onclick="addLetter('к')">к</button><button class="key" onclick="addLetter('е')">е</button><button class="key" onclick="addLetter('н')">н</button><button class="key" onclick="addLetter('г')">г</button><button class="key" onclick="addLetter('ш')">ш</button><button class="key" onclick="addLetter('щ')">щ</button><button class="key" onclick="addLetter('з')">з</button><button class="key" onclick="addLetter('х')">х</button><button class="key" onclick="addLetter('ъ')">ъ</button>
        </div>
        <div class="kb-row">
            <button class="key" onclick="addLetter('ф')">ф</button><button class="key" onclick="addLetter('ы')">ы</button><button class="key" onclick="addLetter('в')">в</button><button class="key" onclick="addLetter('а')">а</button><button class="key" onclick="addLetter('п')">п</button><button class="key" onclick="addLetter('р')">р</button><button class="key" onclick="addLetter('о')">о</button><button class="key" onclick="addLetter('л')">л</button><button class="key" onclick="addLetter('д')">д</button><button class="key" onclick="addLetter('ж')">ж</button><button class="key" onclick="addLetter('э')">э</button>
        </div>
        <div class="kb-row">
            <button class="key wide" onclick="delLetter()">DEL</button>
            <button class="key" onclick="addLetter('я')">я</button><button class="key" onclick="addLetter('ч')">ч</button><button class="key" onclick="addLetter('с')">с</button><button class="key" onclick="addLetter('м')">м</button><button class="key" onclick="addLetter('и')">и</button><button class="key" onclick="addLetter('т')">т</button><button class="key" onclick="addLetter('ь')">ь</button><button class="key" onclick="addLetter('б')">б</button><button class="key" onclick="addLetter('ю')">ю</button>
        </div>
    </div>

    <script>
        // Список слов (можно расширять)
        const WORDS = ["экран", "планы", "огонь", "стена", "весна", "город", "арбуз", "песня", "панель", "вечность", "стекло", "память"];
        // Фильтруем только слова из 5 букв для безопасности
        const validWords = WORDS.filter(w => w.length === 5);
        const secret = validWords[Math.floor(Math.random() * validWords.length)];
        
        const inputEl = document.getElementById("input");

        // Функции ввода
        function addLetter(l) {
            if (inputEl.value.length < 5) inputEl.value += l;
        }

        function delLetter() {
            inputEl.value = inputEl.value.slice(0, -1);
        }

        // Обновление цветов клавиатуры
        function updateKeyColor(letter, status) {
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                if (key.innerText.toLowerCase() === letter) {
                    if (status === 'correct') {
                        key.className = 'key correct';
                    } else if (status === 'present' && !key.classList.contains('correct')) {
                        key.className = 'key present';
                    } else if (status === 'absent' && !key.classList.contains('correct') && !key.classList.contains('present')) {
                        key.className = 'key absent';
                    }
                }
            });
        }

        function guess() {
            const guess = inputEl.value.toLowerCase();
            if (guess.length !== 5) {
                alert("Нужно ввести 5 букв!");
                return;
            }

            const board = document.getElementById("game-board");
            const row = document.createElement("div");
            row.className = "row";

            let secretArr = secret.split('');
            let guessArr = guess.split('');
            let results = new Array(5).fill('absent');

            // 1 проход: ищем совпадения (зеленые)
            for (let i = 0; i < 5; i++) {
                if (guessArr[i] === secretArr[i]) {
                    results[i] = 'correct';
                    updateKeyColor(guess[i], 'correct');
                    secretArr[i] = null;
                    guessArr[i] = null;
                }
            }

            // 2 проход: ищем наличие (желтые) и отсутствие (серые)
            for (let i = 0; i < 5; i++) {
                if (guessArr[i] !== null) {
                    let idx = secretArr.indexOf(guessArr[i]);
                    if (idx !== -1) {
                        results[i] = 'present';
                        updateKeyColor(guess[i], 'present');
                        secretArr[idx] = null;
                    } else {
                        updateKeyColor(guess[i], 'absent');
                    }
                }
            }

            // Отрисовка
            for (let i = 0; i < 5; i++) {
                const tile = document.createElement("div");
                tile.className = `tile ${results[i]}`;
                tile.innerText = guess[i];
                row.appendChild(tile);
            }
            board.appendChild(row);
            inputEl.value = "";

            if (guess === secret) {
                setTimeout(() => {
                    alert("ПОБЕДА! Всё идёт по плану.");
                    location.reload();
                }, 200);
            }
        }

        // Слушатели реальной клавиатуры
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") guess();
            if (e.key === "Backspace") delLetter();
            // Поддержка ввода русских букв с клавиатуры
            if (/^[а-яёА-ЯЁ]$/.test(e.key)) {
                addLetter(e.key.toLowerCase());
            }
        });
    </script>
</body>
</html>
