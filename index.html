<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letovdle - Исправленный</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121213;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            margin: 0;
            user-select: none;
        }
        h1 { margin-bottom: 10px; letter-spacing: 2px; }
        .grid { margin-bottom: 20px; }
        .row { display: flex; gap: 5px; margin-bottom: 5px; }
        .tile {
            width: 50px; height: 50px;
            border: 2px solid #3a3a3c;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: bold; text-transform: uppercase;
        }
        
        /* Цвета статусов с повышенным приоритетом */
        .tile.correct, .key.correct { background-color: #538d4e !important; border-color: #538d4e !important; }
        .tile.present, .key.present { background-color: #b59f3b !important; border-color: #b59f3b !important; }
        .tile.absent, .key.absent { background-color: #3a3a3c !important; border-color: #3a3a3c !important; }

        .keyboard { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; padding: 10px; }
        .kb-row { display: flex; justify-content: center; gap: 6px; }
        .key {
            background-color: #818384;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 15px 10px;
            min-width: 33px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }
        .key.wide { min-width: 65px; }
        
        .controls { margin: 20px 0; }
        input {
            padding: 10px; font-size: 1.2rem; border: none; border-radius: 4px;
            width: 140px; text-align: center; text-transform: uppercase;
            background: #272729; color: white;
        }
    </style>
</head>
<body>

    <h1>LETOVDLE</h1>
    
    <div id="game-board" class="grid"></div>

    <div class="controls">
        <input type="text" id="input" maxlength="5" placeholder="5 БУКВ" autocomplete="off">
        <button class="key wide" style="background-color: #538d4e;" onclick="guess()">OK</button>
    </div>

    <div class="keyboard" id="keyboard">
        <div class="kb-row">
            <button class="key" onclick="addLetter('й')">й</button><button class="key" onclick="addLetter('ц')">ц</button><button class="key" onclick="addLetter('у')">у</button><button class="key" onclick="addLetter('к')">к</button><button class="key" onclick="addLetter('е')">е</button><button class="key" onclick="addLetter('н')">н</button><button class="key" onclick="addLetter('г')">г</button><button class="key" onclick="addLetter('ш')">ш</button><button class="key" onclick="addLetter('щ')">щ</button><button class="key" onclick="addLetter('з')">з</button><button class="key" onclick="addLetter('х')">х</button><button class="key" onclick="addLetter('ъ')">ъ</button>
        </div>
        <div class="kb-row">
            <button class="key" onclick="addLetter('ф')">ф</button><button class="key" onclick="addLetter('ы')">ы</button><button class="key" onclick="addLetter('в')">в</button><button class="key" onclick="addLetter('а')">а</button><button class="key" onclick="addLetter('п')">п</button><button class="key" onclick="addLetter('р')">р</button><button class="key" onclick="addLetter('о')">о</button><button class="key" onclick="addLetter('л')">л</button><button class="key" onclick="addLetter('д')">д</button><button class="key" onclick="addLetter('ж')">ж</button><button class="key" onclick="addLetter('э')">э</button>
        </div>
        <div class="kb-row">
            <button class="key wide" onclick="delLetter()">DEL</button>
            <button class="key" onclick="addLetter('я')">я</button><button class="key" onclick="addLetter('ч')">ч</button><button class="key" onclick="addLetter('с')">с</button><button class="key" onclick="addLetter('м')">м</button><button class="key" onclick="addLetter('и')">и</button><button class="key" onclick="addLetter('т')">т</button><button class="key" onclick="addLetter('ь')">ь</button><button class="key" onclick="addLetter('б')">б</button><button class="key" onclick="addLetter('ю')">ю</button>
        </div>
    </div>

    <script>
        const WORDS = ["экран", "планы", "огонь", "стена", "весна", "город", "арбуз", "песня"];
        const secret = WORDS[Math.floor(Math.random() * WORDS.length)];

        function addLetter(l) { 
            const input = document.getElementById("input");
            if (input.value.length < 5) input.value += l; 
        }
        
        function delLetter() { 
            const input = document.getElementById("input");
            input.value = input.value.slice(0, -1); 
        }

        function updateKeyColor(letter, status) {
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => {
                if (key.textContent.trim().toLowerCase() === letter.toLowerCase()) {
                    // Логика приоритета цветов
                    if (key.classList.contains('correct')) return; // Если уже зеленый, не меняем
                    if (key.classList.contains('present') && status === 'absent') return; // Если желтый, не делаем серым

                    key.classList.remove('correct', 'present', 'absent');
                    key.classList.add(status);
                }
            });
        }

        function guess() {
            const input = document.getElementById("input");
            const guessVal = input.value.toLowerCase();
            
            if (guessVal.length !== 5) {
                alert("Нужно 5 букв!");
                return;
            }

            const board = document.getElementById("game-board");
            const row = document.createElement("div");
            row.className = "row";

            let secretArr = secret.split('');
            let guessArr = guessVal.split('');
            let results = new Array(5).fill('absent');

            // 1 проход: Ищем точные совпадения (Зеленые)
            for (let i = 0; i < 5; i++) {
                if (guessArr[i] === secretArr[i]) {
                    results[i] = 'correct';
                    updateKeyColor(guessVal[i], 'correct');
                    secretArr[i] = null;
                    guessArr[i] = null;
                }
            }

            // 2 проход: Ищем буквы не на своих местах (Желтые/Серые)
            for (let i = 0; i < 5; i++) {
                if (guessArr[i] !== null) {
                    let idx = secretArr.indexOf(guessArr[i]);
                    if (idx !== -1) {
                        results[i] = 'present';
                        updateKeyColor(guessVal[i], 'present');
                        secretArr[idx] = null;
                    } else {
                        updateKeyColor(guessVal[i], 'absent');
                    }
                }
            }

            // Отрисовка плиток
            for (let i = 0; i < 5; i++) {
                const tile = document.createElement("div");
                tile.className = `tile ${results[i]}`;
                tile.innerText = guessVal[i];
                row.appendChild(tile);
            }

            board.appendChild(row);
            input.value = "";
            
            if (guessVal === secret) {
                setTimeout(() => alert("ПОБЕДА! Загаданное слово: " + secret.toUpperCase()), 100);
            }
        }

        // Обработка Enter в поле ввода
        document.getElementById("input").onkeydown = (e) => {
            if (e.key === "Enter") guess();
        };
    </script>
</body>
</html>
